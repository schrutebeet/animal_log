{% extends "base.html" %}

{% block content %}
<div class="absolute inset-0 top-[64px] bg-cover bg-center flex items-center justify-center"
     style="background-image: url('/static/images/vet_background.jpg'); z-index: -1;">
</div>

<div class="relative z-10 flex items-center justify-center min-h-[calc(100vh-64px)]">
    <div class="max-w-md p-6 rounded shadow" style="background-color: #DFEBEB;">
      <h2 class="text-2xl font-semibold mb-4">Login</h2>
      {% if error %}
        <p class="text-red-600">{{ error }}</p>
      {% endif %}
      <form method="post" action="/login">
          <div class="mb-4">
              <label class="block text-gray-700">Username:</label>
              <input type="text" name="username" required class="w-full border px-3 py-2 rounded" />
          </div>
          <div class="mb-6">
              <label class="block text-gray-700">Password:</label>
              <input type="password" name="password" required class="w-full border px-3 py-2 rounded" />
          </div>
          <button type="submit" class="w-full bg-blue-500 hover:bg-blue-700 text-white py-2 px-4 rounded">Login</button>
          <p class="mt-4 text-sm">Don't have an account? <a href="/signup" class="text-blue-600">Sign up</a></p>
      </form>
  </div>
</div>
{% endblock %}
