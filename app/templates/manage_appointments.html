{% extends "base.html" %}

{% block content %}
<h1 class="text-2xl font-bold mb-6">Manage Appointment</h1>

<form method="post" action="/appointments/manage/{{ animal.id }}" class="bg-white p-6 rounded shadow-md max-w-xl mx-auto space-y-4">
    <!-- Animal Name (readonly) -->
    <div>
        <label class="block text-gray-700 font-semibold mb-1">Animal Name</label>
        <input type="text" name="animal_name" value="{{ animal.name }}" readonly
               class="w-full border px-3 py-2 rounded bg-gray-100 cursor-not-allowed">
    </div>

    <!-- Owner (readonly) -->
    <div>
        <label class="block text-gray-700 font-semibold mb-1">Owner</label>
        <input type="text" name="owner" value="{{ animal.owner }}" readonly
               class="w-full border px-3 py-2 rounded bg-gray-100 cursor-not-allowed">
    </div>

    <!-- Vet -->
    <div>
        <label class="block text-gray-700 font-semibold mb-1">Veterinarian</label>
        <input type="text" name="veterinarian" value="{{ request.session.get('user') }}"
               class="w-full border px-3 py-2 rounded" required>
    </div>

    <!-- Date -->
    <div>
        <label class="block text-gray-700 font-semibold mb-1">Date</label>
        <input type="date" name="date" required class="w-full border px-3 py-2 rounded">
    </div>

    <!-- Time -->
    <div>
        <label class="block text-gray-700 font-semibold mb-1">Time</label>
        <input type="time" name="time" required class="w-full border px-3 py-2 rounded">
    </div>

    <!-- Description -->
    <div>
        <label class="block text-gray-700 font-semibold mb-1">Description</label>
        <textarea name="description" rows="4"
                  class="w-full border px-3 py-2 rounded resize-none"
                  placeholder="Describe the purpose of the appointment..."></textarea>
    </div>

    <!-- Submit Button -->
    <div class="text-right">
        <button type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded">
            Save Appointment
        </button>
    </div>
</form>
{% endblock %}
