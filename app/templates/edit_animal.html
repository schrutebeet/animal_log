<!-- app/templates/edit_animal.html -->
{% extends "base.html" %}

{% block content %}
<h2 class="text-2xl font-semibold mb-4">Edit Animal Record</h2>
<form method="post" action="/animals/{{ animal.id }}/edit" class="max-w-lg bg-white p-6 rounded shadow">
    <div class="mb-4">
        <label class="block text-gray-700">Animal Name:</label>
        <input type="text" name="name" value="{{ animal.name }}" required class="w-full border px-3 py-2 rounded" />
    </div>
    <div class="mb-4">
        <label class="block text-gray-700">Owner Name:</label>
        <input type="text" name="owner" value="{{ animal.owner }}" required class="w-full border px-3 py-2 rounded" />
    </div>
    <div class="mb-4">
        <label class="block text-gray-700">Species:</label>
        <input list="species-list" name="species" id="species-input" value="{{ animal.species.common_name }}" required
               class="w-full border px-3 py-2 rounded" />
        <datalist id="species-list"></datalist>
    </div>
    <div class="mb-4">
        <label class="block text-gray-700">Age:</label>
        <input type="number" name="age" min="0" value="{{ animal.age or '' }}" class="w-full border px-3 py-2 rounded" />
    </div>
    <div class="mb-6">
        <label class="block text-gray-700">Weight (kg):</label>
        <input type="number" step="0.1" name="weight" min="0" value="{{ animal.weight or '' }}" class="w-full border px-3 py-2 rounded" />
    </div>
    <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white py-2 px-4 rounded">Update</button>
</form>

<script>
// Reuse the autocomplete script from the registration form
const speciesInput = document.getElementById('species-input');
const dataList = document.getElementById('species-list');

speciesInput.addEventListener('input', async () => {
    const query = speciesInput.value;
    if (query.length < 1) {
        dataList.innerHTML = '';
        return;
    }
    const response = await fetch(`/animals/search/autocomplete?query=${query}`);
    if (response.ok) {
        const suggestions = await response.json();
        dataList.innerHTML = '';
        suggestions.forEach(name => {
            const option = document.createElement('option');
            option.value = name;
            dataList.appendChild(option);
        });
    }
});
</script>
{% endblock %}
