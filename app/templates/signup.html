<!-- app/templates/signup.html -->
{% extends "base.html" %}

{% block content %}
<h2 class="text-2xl font-semibold mb-4">Sign Up</h2>
{% if error %}
  <p class="text-red-600">{{ error }}</p>
{% endif %}
<form method="post" action="/signup" class="max-w-md bg-white p-6 rounded shadow">
    <div class="mb-4">
        <label class="block text-gray-700">Username:</label>
        <input type="text" name="username" required class="w-full border px-3 py-2 rounded" />
    </div>
    <div class="mb-6">
        <label class="block text-gray-700">Password:</label>
        <input type="password" name="password" required class="w-full border px-3 py-2 rounded" />
    </div>
    <button type="submit" class="w-full bg-green-500 hover:bg-green-700 text-white py-2 px-4 rounded">Create Account</button>
    <p class="mt-4 text-sm">Already have an account? <a href="/login" class="text-blue-600">Login</a></p>
</form>
{% endblock %}
