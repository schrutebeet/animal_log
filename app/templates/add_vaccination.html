{% extends "base.html" %}

{% block content %}
<h1 class="text-2xl font-bold mb-6">Add Vaccination Record</h1>

<form method="post" action="/animals/{{ animal.id }}/vaccinations/new" class="bg-white p-6 rounded shadow-md max-w-xl mx-auto space-y-4">
    <!-- Animal Name (readonly) -->
    <div>
        <label class="block text-gray-700 font-semibold mb-1">Animal Name</label>
        <input type="text" name="animal_name" value="{{ animal.name }}" readonly
               class="w-full border px-3 py-2 rounded bg-gray-100 cursor-not-allowed">
    </div>

    <!-- Owner (readonly) -->
    <div>
        <label class="block text-gray-700 font-semibold mb-1">Owner</label>
        <input type="text" name="owner" value="{{ animal.owner }}" readonly
               class="w-full border px-3 py-2 rounded bg-gray-100 cursor-not-allowed">
    </div>

    <!-- Vaccine Name -->
    <div>
        <label class="block text-gray-700 font-semibold mb-1">Vaccine Name</label>
        <input type="text" name="vaccine_name" required
               class="w-full border px-3 py-2 rounded" placeholder="e.g. Rabies">
    </div>

    <!-- Date Administered -->
    <div>
        <label class="block text-gray-700 font-semibold mb-1">Date Administered</label>
        <input type="date" name="date_administered" required
               class="w-full border px-3 py-2 rounded">
    </div>

    <!-- Expiry Date -->
    <div>
        <label class="block text-gray-700 font-semibold mb-1">Expiry Date (optional)</label>
        <input type="date" name="expiry_date"
               class="w-full border px-3 py-2 rounded">
    </div>

    <!-- Notes -->
    <div>
        <label class="block text-gray-700 font-semibold mb-1">Notes</label>
        <textarea name="notes" rows="3"
                  class="w-full border px-3 py-2 rounded resize-none"
                  placeholder="Any additional notes..."></textarea>
    </div>

    <!-- Submit Button -->
    <div class="text-right">
        <button type="submit"
                class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded">
            Save Vaccination
        </button>
    </div>
</form>
{% endblock %}
